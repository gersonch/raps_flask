{% extends 'base.html' %} {% block header %}
<h2>{% block title %}Ejercicio 2 - Iniciar sesión{% endblock title %}</h2>
{% endblock header %} {% block content %}

<form class="formulario" method="post" action="{{ url_for('pages.ejercicio2') }}">
  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" name="usuario" required />

  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" required />

  <button type="submit">Ingresar</button>
</form>

{% if mensaje %}
  <div class="mensaje {% if exito %}mensaje-exito{% else %}mensaje-error{% endif %}">
    <p>{{ mensaje }}</p>
  </div>
{% endif %}

<p class="volver">
  <a href="{{ url_for('pages.home') }}">&larr; Volver al inicio</a>
</p>
{% endblock content %}
